name: Build & Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Published under burgerkorb731's GHCR namespace (the homelab cluster's
      # image), not this repo's own GITHUB_TOKEN — the default token only
      # has package-write in this repo's own owner. GHCR_PUSH_USERNAME/
      # GHCR_PUSH_TOKEN are a classic PAT (write:packages, read:packages)
      # from burgerkorb731, added as repo secrets here. Same setup as
      # theheinsmit-cloud/strand-squash-club.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUSH_USERNAME }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/burgerkorb731/vanta:latest
            ghcr.io/burgerkorb731/vanta:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No manifest bump here — the homelab cluster's ArgoCD Image Updater
      # watches this image in GHCR directly and writes the new digest back
      # to k3s/vanta/kustomization.yaml, so this workflow never needs write
      # access to the homelab repo.
