<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VANTA Admin</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600&family=Jost:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><img src="/assets/logo.png" alt=""><div><span>VANTA</span><small>Admin</small></div></div>
    <nav id="nav" aria-label="Admin">
      <a href="#/" data-nav="dashboard">Dashboard</a>
      <a href="#/orders" data-nav="orders">Orders</a>
      <a href="#/finance" data-nav="finance">Finance</a>
      <a href="#/inventory" data-nav="inventory">Inventory</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <button id="logout" class="linkbtn" type="button">Sign out</button>
  </aside>
  <div class="main">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn" type="button" aria-label="Menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="brand-mini">VANTA Admin</span>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/admin/static/admin.js"></script>
</body>
</html>
